name: Update featured language chart

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "scripts/update-featured-languages.py"
      - ".github/workflows/featured-languages.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recalculate featured-project language shares
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update-featured-languages.py
      - name: Commit updated SVG if changed
        run: |
          git add assets/featured-languages.svg
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m 'Refresh featured-project language chart'
            git push
          fi
